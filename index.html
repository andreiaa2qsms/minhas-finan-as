      <div class="month-switcher">
        <button class="icon-btn" id="prevMonth" aria-label="Mês anterior">‹</button>
        <select id="monthSelect" aria-label="Selecionar mês"></select>
        <button class="icon-btn" id="nextMonth" aria-label="Próximo mês">›</button>
        <button class="btn" id="newMonthBtn">+ novo mês</button>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="importNavBtn"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.5 12 14.5 16 10.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span> Importar arquivo</button>
        <button class="btn btn-primary" id="addTxnBtn">+ Lançamento</button>
      </div>
    </header>

    <main id="viewport">
      <section id="view-overview" class="view"></section>
      <section id="view-transactions" class="view" hidden></section>
      <section id="view-card" class="view" hidden></section>
      <section id="view-categories" class="view" hidden></section>
      <section id="view-budget" class="view" hidden></section>
      <section id="view-import" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>
